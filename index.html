<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stylesphere</title>
    <link rel="stylesheet" href="style.css">
     <!--Icones-->
    <link rel="stylesheet" href="https:/cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="topo">
        Primeira compra, 10% OFF, cupom STYLES10
    </div>
    <header class="menu">
        <div class="logo">
            STYLESPHERE
        </div>
        <nav>
            <a href="#">NEW COLLECTION</a>
            <a href="#">BLUSAS</a>
            <a href="#">VESTIDOS</a>
            <a href="#">CALÇAS</a>
            <a href="#">JAQUETAS</a>
            <a href="#">SOBRE NÓS</a>
        </nav>
        <div class="icons">
            <i class="fa-solid fa-magnifying-glass"></i>
            <i class="fa-solid fa-bag-shopping"></i>
            <i class="fa-solid fa-user"></i>
        </div>
    </header>
    <section class="banner">
        <div class="texto-banner">
            <h1>BLACK FRIDAY</h1>
            <h2>ATÉ 70% OFF</h2>
            <button>SHOP NOW</button>
        </div>
    </section>
    <section class="categorias">
        <div class="card">
            <img src="https://images.unsplash.com/photo-1496747611176-843222e1e57c?q=80&w=687&auto=format&fit=crop" alt="">
            <h3>VESTIDOS</h3>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1483985988355-763728e1935b?q=80&w=687&auto=format&fit=crop" alt="">
            <h3>BLUSAS</h3>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=687&auto=format&fit=crop" alt="">
            <h3>CALÇAS</h3>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?q=80&w=687&auto=format&fit=crop" alt="">
            <h3>JAQUETAS</h3>
        </div>
    </section>
    <section class="destaque">
        <div class="texto-destaque">
            <h2>COR DESTAQUE DA TEMPORADA</h2>
            <h1>CACAU</h1>
            <button>SHOP NOW</button>
        </div>
    </section>
    <section class="produtos">
        <h1>OS MAIS DESEJADOS</h1>
        <div class="cards-produtos">
            <img src="https://images.unsplash.com/photo-1495385794356-15371f348c31?q=80&w=687&auto=format&fit=crop" alt="">
        </div>
    </section>
</body>
</html>
